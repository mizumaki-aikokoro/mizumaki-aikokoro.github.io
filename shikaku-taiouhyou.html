<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>視覚トレーニング　カード対応表（スタッフ用）</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="logo.png" type="image/png">
<link rel="stylesheet" href="styles.css">
<style>
  body { background: #f7f9f6; }
  .doc-wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 60px; }
  .doc-head { text-align: center; margin: 18px 0 22px; }
  .doc-head h1 { font-size: 1.4rem; color: var(--green-dark); margin: 0 0 8px; }
  .doc-head p { font-size: 0.88rem; color: var(--text-sub); margin: 0; }

  .dl-bar { text-align: center; margin: 0 0 20px; }
  .dl-btn {
    display: inline-block; background: var(--green-dark); color: #fff; text-decoration: none;
    border-radius: 30px; padding: 10px 28px; font-size: 0.95rem;
  }
  .dl-btn:hover { opacity: 0.9; }

  .pdf-frame-wrap {
    border: 1px solid #e2e8dd; border-radius: 12px; overflow: hidden;
    background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .pdf-frame-wrap iframe { width: 100%; height: 80vh; border: 0; display: block; }

  .fallback { text-align: center; font-size: 0.85rem; color: var(--text-sub); margin-top: 14px; }
</style>
</head>
<body>

<div class="doc-wrap">
  <div class="doc-head">
    <h1>視覚トレーニング　カード対応表（スタッフ用）</h1>
    <p>視覚カード（No.1〜40）の分類・見どころ一覧です。参加者に見せず、進行の答え合わせにお使いください。</p>
  </div>

  <div class="dl-bar">
    <a class="dl-btn" href="files/shikaku-taiouhyou.pdf" target="_blank" rel="noopener">PDFを開く／ダウンロード</a>
  </div>

  <div class="pdf-frame-wrap">
    <iframe src="files/shikaku-taiouhyou.pdf" title="視覚トレーニング カード対応表"></iframe>
  </div>
  <p class="fallback">表示されない場合は、上の「PDFを開く／ダウンロード」からご覧ください。</p>
</div>

</body>
</html>
